# Tests, then the two Docker images.
#
# The image jobs are the point. The images were written without a container
# runtime available to build them, so until this workflow runs they are
# unverified — and an image that will not boot is the most expensive kind of
# thing to discover during a first Render deploy. GitHub Actions has Docker, so
# the first push proves them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"       # matches the images

      - name: Install (non-editable, as the images do)
        run: |
          python -m pip install --upgrade pip
          pip install ".[api,queue,postgres,dev]"

      - name: Lint
        run: ruff check foci_screen tests tools

      - name: Tests
        run: pytest -q

      - name: Install smoke test
        # From a directory with no source tree, so it exercises what the wheel
        # actually ships rather than the checkout.
        run: |
          mkdir -p /tmp/elsewhere
          cd /tmp/elsewhere
          python "$GITHUB_WORKSPACE/tools/install_smoke.py"

  # The Postgres-only behaviour, against a real Postgres: the copy that moves a
  # database between hosts (and the id counters it must reset), a connection the
  # server closes, and the lock two instances share. None of it can be shown
  # with stand-ins, and it is exactly what a move to Cloud SQL leans on.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foci
          POSTGRES_PASSWORD: foci
          POSTGRES_DB: foci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[api,queue,postgres,dev]"

      - name: Tests against a real Postgres
        # `shell: bash` turns on pipefail, so a failing pytest is not hidden by tee.
        shell: bash
        env:
          FOCI_TEST_DATABASE_URL: postgresql://foci:foci@localhost:5432/foci
        run: |
          pytest -q tests/test_postgres_live.py -rs | tee /tmp/pg.txt
          # A skip here would mean the job proved nothing while looking green.
          if grep -q "SKIPPED" /tmp/pg.txt; then
            echo "The live Postgres tests were skipped."; exit 1
          fi

      - name: The copy command, end to end
        shell: bash
        env:
          FOCI_USER_AGENT: "foci-screen CI (ci@example.org)"
          OLD: postgresql://foci:foci@localhost:5432/old_site
          NEW: postgresql://foci:foci@localhost:5432/new_site
        run: |
          # Two databases, and something to move between them: a schema with
          # rows in it, made by the application itself.
          python tools/ci_seed_for_copy.py
          SOURCE_DATABASE_URL="$OLD" DATABASE_URL="$NEW" foci-screen copy-db | tee /tmp/copy.txt
          grep -q "every table's count matches the source" /tmp/copy.txt
          if grep -q "foci:foci" /tmp/copy.txt; then
            echo "The copy printed a database password."; exit 1
          fi

  api-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foci
          POSTGRES_PASSWORD: foci
          POSTGRES_DB: foci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: foci-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot it and check the Render health path
        run: |
          docker run -d --name api -p 8000:8000 \
            -e FOCI_API_KEYS=ci:ci-key \
            -e FOCI_USER_AGENT="foci-screen CI (ci@example.org)" \
            foci-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          # The web UI must be inside the image, not just the repo.
          curl -fsS http://localhost:8000/ | grep -q FOCI-Screener
          curl -fsS http://localhost:8000/app.js > /dev/null
          curl -fsS http://localhost:8000/concord-logo.png > /dev/null
          # Auth must fail closed.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/v1/overview)" = 401
          curl -fsS -H 'Authorization: Bearer ci-key' http://localhost:8000/v1/overview > /dev/null
          docker logs api | grep -i traceback && exit 1 || true
          docker rm -f api

      - name: Boot it the way Cloud Run does
        # Cloud Run chooses the port (8080), names the service and the deploy in
        # the environment, and the database is Postgres. This is as close to a
        # first deploy there as a runner gets: if the image cannot start like
        # this, it is cheaper to find out here.
        run: |
          docker run -d --name cloudrun --network host \
            -e PORT=8080 -e K_SERVICE=foci -e K_REVISION=foci-ci-00001 \
            -e DATABASE_URL=postgresql://foci:foci@localhost:5432/foci \
            -e FOCI_API_KEYS=ci:ci-key -e FOCI_INPROCESS_SCREENS=true \
            -e FOCI_USER_AGENT="foci-screen CI (ci@example.org)" \
            foci-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /tmp/cloudrun.json; then break; fi
            sleep 2
          done
          cat /tmp/cloudrun.json
          python3 -c "
          import json
          h = json.load(open('/tmp/cloudrun.json'))
          assert h['host'] == 'Cloud Run', h
          assert h['revision'] == 'foci-ci-00001', h
          assert h['database'] == 'postgres', h
          assert h['warnings'] == [], h['warnings']
          "
          curl -fsS -H 'Authorization: Bearer ci-key' http://localhost:8080/v1/overview > /dev/null
          # Behind the host's proxy the app must believe the forwarded address:
          # it puts it in alert emails and uses it to stay awake during a screen.
          curl -fsS -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-Host: foci.example' \
            http://localhost:8080/health > /dev/null
          # The copy command ships in the image, since that is where a move runs it.
          docker exec cloudrun foci-screen copy-db --help | grep -q "allow-nonempty"
          docker logs cloudrun | grep -i traceback && exit 1 || true
          docker rm -f cloudrun

  worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          push: false
          load: true
          tags: foci-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Chromium actually launches as the unprivileged user
        # The failure this catches: `playwright install --with-deps` runs as root
        # and the image then drops to uid 10001. If the browser or its system
        # libraries are unreadable afterwards, every IR page silently goes
        # unread in production while the worker looks healthy.
        run: |
          docker run --rm foci-worker:ci python -c "
          from foci_screen.connectors.browser import LAUNCH_ARGS, user_agent
          from playwright.sync_api import sync_playwright
          p = sync_playwright().start()
          b = p.chromium.launch(headless=True, args=list(LAUNCH_ARGS))
          page = b.new_context(user_agent=user_agent('foci-screen CI (ci@example.org)')).new_page()
          page.set_content('<main>rendered</main>')
          assert 'rendered' in page.content()
          print('chromium ok:', b.version)
          b.close(); p.stop()
          "

      - name: Worker entry point starts and reports a missing queue
        run: |
          set +e
          out=$(docker run --rm foci-worker:ci python -m foci_screen.worker 2>&1)
          code=$?
          set -e
          echo "$out"
          echo "exit $code"
          echo "$out" | grep -qi "redis" || { echo "expected a queue diagnostic"; exit 1; }
          echo "$out" | grep -qi traceback && exit 1 || true
