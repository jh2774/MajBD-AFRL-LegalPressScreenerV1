# One-off: copy every table from the old database into the new one, for moving
# the site to another host (docs/VERCEL.md, "Copy the data"). Runs only when
# started by hand from the Actions tab, and only for people who can push.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions),
# deleted again once the move is done:
#   SOURCE_DATABASE_URL  the old database: Render's External Database URL
#   TARGET_DATABASE_URL  the new database: Neon's direct (unpooled) URL
#
# This repository is public, and so is this workflow's log. The log says only
# which tables were copied and how many rows each had; the database addresses
# are masked.
name: Copy database

on:
  workflow_dispatch: {}

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --quiet .
      - name: Copy, then compare row counts
        shell: bash
        env:
          SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.TARGET_DATABASE_URL }}
        run: |
          if [ -z "$SOURCE_DATABASE_URL" ] || [ -z "$DATABASE_URL" ]; then
            echo "Set SOURCE_DATABASE_URL and TARGET_DATABASE_URL as repository secrets first."
            exit 1
          fi
          # The output names each database by its host; keep those out of a
          # public log.
          for url in "$SOURCE_DATABASE_URL" "$DATABASE_URL"; do
            host=$(python -c "import sys, urllib.parse as u; print(u.urlsplit(sys.argv[1]).hostname or '')" "$url")
            [ -n "$host" ] && echo "::add-mask::$host"
          done
          foci-screen copy-db
