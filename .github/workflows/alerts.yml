# Once a day, ask the deployed site to check every watched firm and email what
# is new. Vercel's free plan runs a schedule only once a day and a free Render
# instance has none, so this does it, and costs nothing.
#
# Does nothing until the site's address is set in the repository
# (Settings → Secrets and variables → Actions):
#   variable  FOCI_SITE_URL    e.g. https://contractscreener.com
#   secret    FOCI_ALERTS_KEY  only for a site that needs a key (not FOCI_PUBLIC):
#                              an API key it accepts, the part after "tenant:"
#
# Also runnable by hand from the Actions tab ("Run workflow").
name: Daily alerts

on:
  schedule:
    - cron: "15 12 * * *"      # 12:15 UTC, every day
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check portfolios and send alerts
        env:
          SITE: ${{ vars.FOCI_SITE_URL }}
          KEY: ${{ secrets.FOCI_ALERTS_KEY }}
        run: |
          if [ -z "$SITE" ]; then
            echo "FOCI_SITE_URL is not set, so there is nothing to do."
            exit 0
          fi
          auth=()
          if [ -n "$KEY" ]; then
            auth=(-H "Authorization: Bearer $KEY")
          fi
          # A host that sleeps when idle wakes on the first request, which can
          # take the better part of a minute.
          curl -sS --retry 4 --retry-delay 20 --retry-all-errors --max-time 90 \
            "$SITE/health" > /dev/null || true
          curl -fsS --max-time 600 -X POST "$SITE/v1/alerts/run" \
            "${auth[@]}" -H "Content-Type: application/json" -d '{}'
